<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Эфир — онлайн-радио</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f7;--sf:#fff;--sf2:#f0f0f2;--bd:#e4e5e8;--tx:#0f1114;--mu:#6a6f78;--ac:#0f1114;--on:#fff;--live:#d4483b;--sh:0 1px 2px rgba(0,0,0,.04),0 16px 40px -18px rgba(0,0,0,.22);--sw:232px;--bh:76px;--f:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
:root[data-theme=dark]{--bg:#0b0c0e;--sf:#131417;--sf2:#1a1c20;--bd:#25272c;--tx:#eceef1;--mu:#8b9099;--ac:#eceef1;--on:#0b0c0e;--live:#e5675b;--sh:0 1px 2px rgba(0,0,0,.4),0 16px 40px -18px #000}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{color-scheme:light}html[data-theme=dark]{color-scheme:dark}
body{font:400 14px/1.45 var(--f);background:var(--bg);color:var(--tx);min-height:100dvh;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum","cv11"}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0;text-align:left}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}svg.f{fill:currentColor}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
::selection{background:var(--ac);color:var(--on)}
/* навигация */
#rail{position:fixed;inset:0 auto 0 0;width:var(--sw);padding:26px 14px;border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;gap:2px;z-index:10}
.wm{font-size:17px;font-weight:600;letter-spacing:-.01em;padding:0 12px 26px;display:flex;align-items:center;gap:10px}.wm i{width:8px;height:8px;border-radius:50%;background:var(--live)}
.tb{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--mu);font-weight:500;transition:background .15s,color .15s}.tb:hover{color:var(--tx);background:var(--sf2)}.tb.on{color:var(--tx);background:var(--sf2)}
.wrap{margin-left:var(--sw);padding:0 40px calc(var(--bh) + 48px);max-width:1280px}
.top{display:flex;justify-content:space-between;align-items:center;padding:30px 0 18px}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em}
.tools{display:flex;gap:8px}
.ib{height:36px;min-width:36px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:border-color .15s,background .15s}.ib:hover{border-color:var(--mu)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.srch{flex:1 1 280px;display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--mu);transition:border-color .15s}.srch:focus-within{border-color:var(--tx)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14px}.srch kbd{font:500 11px var(--f);border:1px solid var(--bd);border-radius:4px;padding:1px 6px}
.fbs{display:flex;gap:8px;flex-wrap:wrap}
.fb{height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:border-color .15s}.fb:hover{border-color:var(--mu)}.fb .lb{color:var(--mu)}.fb .vl{font-weight:500;max-width:150px;overflow:hidden;text-overflow:ellipsis}.fb.act{border-color:var(--tx)}.fb svg{width:16px;height:16px;color:var(--mu)}
/* список */
.tbl{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.th,.rw{display:grid;grid-template-columns:40px minmax(0,2fr) minmax(0,1.1fr) minmax(0,1.4fr) 120px 40px;gap:16px;align-items:center;padding:0 16px}
.th{height:38px;color:var(--mu);font-size:12px;border-bottom:1px solid var(--bd)}
.rw{position:relative;min-height:60px;padding-top:10px;padding-bottom:10px;cursor:pointer;transition:background .12s;outline-offset:-2px}.rw+.rw{border-top:1px solid var(--bd)}.rw:hover{background:var(--sf2)}
.art{width:40px;height:40px;border-radius:8px;background:var(--sf2);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;color:var(--mu);font-size:15px;overflow:hidden;position:relative}.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.nm b{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm b span.t{overflow:hidden;text-overflow:ellipsis}
.nm small{display:none;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fq{color:var(--tx);font-weight:500;margin-right:6px}
.rw.on .nm b{font-weight:600}
.hb{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--mu);transition:.15s}.hb:hover{background:var(--bd);color:var(--tx)}.hb.on{color:var(--live)}
.eq{display:none;gap:2px;align-items:flex-end;height:11px;flex:none}.eq i{width:2px;background:var(--tx);animation:eq .9s infinite alternate}.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}@keyframes eq{from{height:2px}to{height:11px}}
.rw.on.pl .eq,.pl .mini .eq{display:inline-flex}
.sk{height:60px;display:flex;align-items:center;gap:16px;padding:0 16px}.sk+.sk{border-top:1px solid var(--bd)}.sk i{display:block;border-radius:6px;background:linear-gradient(90deg,var(--sf2),var(--bd),var(--sf2));background-size:200% 100%;animation:sk 1.4s infinite}.sk i:first-child{width:40px;height:40px}.sk i:last-child{height:12px;flex:1;max-width:260px}@keyframes sk{to{background-position:-200% 0}}
.st{text-align:center;padding:72px 20px;color:var(--mu)}.st b{display:block;color:var(--tx);font-weight:600;font-size:15px;margin-bottom:4px}.st button{margin-top:16px;height:36px;padding:0 16px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:500}
#sent{height:1px}
/* карта */
#mapw{display:none;position:relative;height:calc(100dvh - 230px);min-height:360px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--sf);touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
.zm{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--sf)}.zm button{width:36px;height:36px;display:grid;place-items:center}.zm button+button{border-top:1px solid var(--bd)}.zm button:hover{background:var(--sf2)}
#mc{position:absolute;left:12px;bottom:12px;width:min(380px,calc(100% - 24px));display:none;align-items:center;gap:12px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);box-shadow:var(--sh)}
.go{height:34px;padding:0 14px;border-radius:8px;background:var(--ac);color:var(--on);font-weight:500;display:flex;align-items:center;gap:6px;flex:none}
/* плеер */
.mini{position:fixed;left:var(--sw);right:0;bottom:0;height:var(--bh);z-index:15;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:0 40px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd)}
.op{display:flex;align-items:center;gap:12px;min-width:0}.op .art{width:44px;height:44px}
.inf{min-width:0}.inf b{display:flex;gap:8px;align-items:center;font-weight:500;white-space:nowrap}.inf b span.t{overflow:hidden;text-overflow:ellipsis}.inf small{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{display:flex;align-items:center;gap:6px}.bt{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx);transition:background .15s}.bt:hover{background:var(--sf2)}
.pb{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;transition:transform .12s}.pb:active{transform:scale(.94)}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:6px;color:var(--mu)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--tx) var(--p,80%),var(--bd) var(--p,80%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--tx);border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--tx);border:0}
.np{position:fixed;top:0;right:0;bottom:var(--bh);width:400px;z-index:14;background:var(--bg);border-left:1px solid var(--bd);transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 28px}.np.open{transform:none}.np.drag{transition:none}
.gr{display:none;width:36px;height:4px;border-radius:2px;background:var(--bd);margin:6px auto 14px}
.nh{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12.5px;margin-bottom:18px}
#na .art{width:100%;max-width:300px;height:auto;aspect-ratio:1;margin:0 auto;border-radius:14px;font-size:72px;box-shadow:var(--sh)}
.ti{display:flex;align-items:center;gap:12px;margin:22px 0 4px}.ti h2{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.25}.ti p{color:var(--mu)}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 6px}.tg span{font-size:12px;padding:3px 8px;border:1px solid var(--bd);border-radius:6px;color:var(--mu)}.tg .lv{color:var(--live);border-color:color-mix(in srgb,var(--live) 40%,var(--bd))}
canvas#cv{width:100%;height:48px;display:block;margin:10px 0 6px}
.dial{display:none;position:relative;height:22px;margin-bottom:8px;font-size:10.5px;color:var(--mu)}.dial::before{content:"";position:absolute;left:0;right:0;top:2px;height:7px;background:repeating-linear-gradient(90deg,var(--bd) 0 1px,transparent 1px 6px)}.dial em{position:absolute;top:0;width:2px;height:12px;background:var(--tx);border-radius:1px;transition:left .8s cubic-bezier(.2,.9,.2,1)}.dial s{position:absolute;bottom:0;text-decoration:none}
.ct{display:flex;justify-content:center;align-items:center;gap:22px;margin:14px 0 20px}.ct .bt svg{width:26px;height:26px}.ct .pb{width:58px;height:58px}.ct .pb svg{width:26px;height:26px}
.vr{display:flex;align-items:center;gap:12px;color:var(--mu);margin-bottom:6px}.vr input{flex:1;width:auto}
.ac2{display:flex;gap:8px;margin:18px 0}.ac2 button{flex:1;height:38px;border:1px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;background:var(--sf)}.ac2 button:hover{border-color:var(--mu)}.ac2 .on{border-color:var(--tx)}
.q h3{font-size:13px;font-weight:500;color:var(--mu);margin:20px 0 8px}.q .rw{grid-template-columns:40px 1fr;padding:8px 12px;min-height:56px}
/* меню и уведомления */
.bd{position:fixed;inset:0;z-index:60;background:rgba(10,11,13,.4);opacity:0;pointer-events:none;transition:opacity .2s}.bd.open{opacity:1;pointer-events:auto}
.pop{position:fixed;z-index:61;width:300px;max-height:380px;display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);opacity:0;transform:translateY(-4px) scale(.98);pointer-events:none;transition:opacity .15s,transform .15s;overflow:hidden}.pop.open{opacity:1;transform:none;pointer-events:auto}
.ph{padding:12px 14px 6px;font-size:12px;color:var(--mu)}
.pq{display:flex;align-items:center;gap:8px;margin:4px 10px 6px;padding:0 10px;height:36px;border:1px solid var(--bd);border-radius:8px;color:var(--mu)}.pq:focus-within{border-color:var(--tx)}.pq input{flex:1;background:none;border:0;outline:0;color:var(--tx);min-width:0}.pq svg{width:16px;height:16px}
.pl{overflow-y:auto;padding:4px 6px 8px;overscroll-behavior:contain}
.pi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:7px;transition:background .1s}.pi:hover,.pi:focus-visible{background:var(--sf2)}.pi span.l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi small{color:var(--mu);font-size:12px}.pi svg{width:16px;height:16px}.pi.sel span.l{font-weight:600}
.pe{padding:22px;text-align:center;color:var(--mu)}
#toasts{position:fixed;z-index:80;right:24px;top:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.ts{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:380px;padding:10px 12px 10px 14px;background:var(--tx);color:var(--bg);border-radius:10px;box-shadow:var(--sh);font-weight:500;animation:ti .25s cubic-bezier(.2,.8,.2,1)}.ts.out{opacity:0;transform:translateY(-6px);transition:.2s}.ts button{font-weight:600;padding:4px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg) 18%,transparent);white-space:nowrap}.ts svg{width:18px;height:18px}.ts.er svg{color:var(--live)}
@keyframes ti{from{opacity:0;transform:translateY(-8px)}}
/* телефон */
@media(max-width:899px){
:root{--sw:0px;--bh:64px}
#rail{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);justify-content:space-around;gap:0}
.wm{display:none}.tb{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;background:none!important}.tb.on{color:var(--tx)}.tb:not(.on){color:var(--mu)}
.wrap{margin:0;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
.top{padding:calc(20px + env(safe-area-inset-top)) 0 12px}h1{font-size:28px}
.srch{flex:1 0 100%}.srch kbd{display:none}.fbs{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;margin:0 -16px;padding:0 16px}.fbs::-webkit-scrollbar{display:none}.fb{flex:none}
.th{display:none}.rw{grid-template-columns:44px minmax(0,1fr) 40px;gap:12px;padding:8px 8px 8px 12px}.c{display:none}.nm small{display:block}.art{width:44px;height:44px}
.mini{left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));height:60px;grid-template-columns:1fr auto;padding:0 8px 0 8px;gap:8px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--sf) 92%,transparent);box-shadow:var(--sh)}
.mini .op .art{width:42px;height:42px}.cc .pv,.rt{display:none}.cc{gap:0}
.np{inset:0;width:auto;bottom:0;border-left:0;transform:translateY(102%);z-index:40;padding:calc(8px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom))}.np.open{transform:none}.gr{display:block}
#na .art{max-width:min(78vw,320px)}
#mapw{height:calc(100dvh - 330px)}
#toasts{left:12px;right:12px;top:auto;bottom:calc(134px + env(safe-area-inset-bottom));align-items:center}
.pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:78dvh!important;border-radius:16px 16px 0 0;border-width:1px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}.pop.open{transform:none}
.pop .gr{display:block}.pi{padding:13px 12px;font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.8"/><path d="M8 8a5.700 5.700 0 0 0 0 8M16 8a5.700 5.700 0 0 1 0 8M5.200 5.200a9.700 9.700 0 0 0 0 13.600M18.800 5.200a9.700 9.700 0 0 1 0 13.600"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.800" ry="9"/><path d="M3 12h18"/></symbol>
<symbol id="heart" viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-7.500-10.200A4.200 4.200 0 0 1 12 7.300a4.200 4.200 0 0 1 7.500 2.500C19.500 15.400 12 20 12 20z"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.500 2"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M8 5.200v13.600a.8.8 0 0 0 1.200.7l10.800-6.800a.8.8 0 0 0 0-1.400L9.200 4.500A.8.8 0 0 0 8 5.200z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><rect x="6.500" y="5" width="3.800" height="14" rx="1"/><rect x="13.700" y="5" width="3.800" height="14" rx="1"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M6 6.200v11.600a.7.7 0 0 0 1.100.6l7.800-5.800a.7.700 0 0 0 0-1.200L7.100 5.600A.7.7 0 0 0 6 6.200zM18 6v12"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M18 6.200v11.600a.7.7 0 0 1-1.100.6l-7.800-5.800a.7.7 0 0 1 0-1.200l7.800-5.800A.7.7 0 0 1 18 6.200zM6 6v12"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.600 5.600l1.400 1.400M17 17l1.400 1.400M5.600 18.400L7 17M17 7l1.400-1.400"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500"/></symbol>
<symbol id="vol" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16.500 9a4 4 0 0 1 0 6"/></symbol>
<symbol id="vol0" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/></symbol>
<symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.500 1.500M9.500 2.500h5"/></symbol>
<symbol id="shuffle" viewBox="0 0 24 24"><path d="M3 7h3c5 0 6 10 11 10h3M3 17h3c1.500 0 2.600-.8 3.500-2M13.500 9c1-1.300 2.200-2 3.500-2h3M17 4l3 3-3 3M17 14l3 3-3 3"/></symbol>
<symbol id="alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.500v5M12 16h.01"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
</defs></svg>

<nav id="rail">
  <div class="wm"><i></i>Эфир</div>
  <button class="tb on" data-t="all"><svg class="i"><use href="#radio"/></svg><span data-i="t_all"></span></button>
  <button class="tb" data-t="map"><svg class="i"><use href="#globe"/></svg><span data-i="t_map"></span></button>
  <button class="tb" data-t="fav"><svg class="i"><use href="#heart"/></svg><span data-i="t_fav"></span></button>
  <button class="tb" data-t="hist"><svg class="i"><use href="#clock"/></svg><span data-i="t_hist"></span></button>
</nav>

<main class="wrap">
  <header class="top"><h1 id="ttl"></h1><div class="tools"><button class="ib" id="lg"></button><button class="ib" id="th" aria-label="theme"></button></div></header>
  <div class="bar">
    <label class="srch"><svg class="i" style="width:18px;height:18px"><use href="#search"/></svg><input id="q" type="search" autocomplete="off" enterkeyhint="search"><kbd>/</kbd></label>
    <div class="fbs" id="fbs">
      <button class="fb" id="fc"><span class="lb" data-i="f_cc"></span><span class="vl" id="vc"></span><svg class="i"><use href="#chev"/></svg></button>
      <button class="fb" id="fg"><span class="lb" data-i="f_tag"></span><span class="vl" id="vg"></span><svg class="i"><use href="#chev"/></svg></button>
      <button class="fb" id="fo"><span class="lb" data-i="f_ord"></span><span class="vl" id="vo"></span><svg class="i"><use href="#chev"/></svg></button>
      <button class="ib" id="rnd" style="height:40px" aria-label="random"><svg class="i"><use href="#shuffle"/></svg></button>

/* каталог */
function params(lim,extra){const p=new URLSearchParams({limit:lim,hidebroken:true,order:S.ord==='trend'?'clicktrend':S.ord,reverse:!['name','random'].includes(S.ord),...extra});if(S.q)p.set('name',S.q);if(S.cc)p.set('countrycode',S.cc);if(S.tag)p.set('tag',S.tag);return p}

/* карта */
const cv0=$('#map'),m0=cv0.getContext('2d'),M={cx:15,cy:25,z:1,d:1,sel:null};

  try{const r=(await api('/json/stations/search?'+params(1500,{has_geo_info:true,order:'clickcount',reverse:true}))).filter(x=>okUrl(x)&&x.geo_lat&&x.geo_long);if(id!==S.req)return;S.mapL=r;dirty();toast(t('map_n',{n:r.length}),{ok:1})}catch{toast(t('err'),{err:1})}}
let pt=null;

cv0.addEventListener('pointerup',e=>{if(pt&&pt.mv<6){const b=cv0.getBoundingClientRect(),s=sc();let best=null,bd=24;
  for(const x of S.mapL)for(const k of[-360,0,360]){const px=b.width/2+(x.geo_long+k-M.cx)*s,py=b.height/2-(x.geo_lat-M.cy)*s,d=Math.hypot(px-(e.clientX-b.left),py-(e.clientY-b.top));if(d<bd){bd=d;best=x}}
  M.sel=best;dirty();const c=$('#mc');if(best){c.style.display='flex';c.innerHTML=`${art(best)}<div class="inf" style="flex:1"><b><span class="t">${esc(best.name.trim())}</span></b><small>${esc(best.country||'')}</small></div><button class="go" id="mg">${ic('play','f')}${t('listen')}</button>`;$('#mg').onclick=()=>play(best,S.mapL)}else c.style.display='none'}pt=null});
cv0.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2)},{passive:false});
const zoom=f=>{M.z=Math.max(1,Math.min(40,M.z*f));dirty()};$('#zi').onclick=()=>zoom(1.6);$('#zo').onclick=()=>zoom(1/1.6);addEventListener('resize',dirty);

/* плеер */
function play(x,list){
  if(!x)return;S.cur=x;if(list)S.queue=list;S.errs=0;
  au.src=x.url_resolved;au.play().catch(()=>{});
  const meta=[x.country,cap((x.tags||'').split(',')[0])].filter(Boolean).join(' · ')||t('radio');
  $('#mini').hidden=false;$('#mn').textContent=$('#nn').textContent=x.name.trim();$('#nm').textContent=meta;$('#ms').textContent=t('conn');
  $('#ma').innerHTML=$('#na').innerHTML=art(x);
  const f=freq(x.name),d=$('#dial');d.style.display=f?'block':'none';if(f)d.querySelector('em').style.left=`calc(${(f-87.5)/20.5*100}% - 1px)`;
  $('#tg').innerHTML=`<span class="lv">● LIVE</span>${f?`<span>${f} FM</span>`:''}${x.bitrate?`<span>${x.bitrate} kbps</span>`:''}${x.codec?`<span>${esc(x.codec)}</span>`:''}`;
  S.hist=[x,...S.hist.filter(y=>y.stationuuid!==x.stationuuid)].slice(0,50);ls.s('hist',S.hist);
  api('/json/url/'+x.stationuuid).catch(()=>{});
  favUI();queueUI();if(S.tab!=='map')render();
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:x.name.trim(),artist:x.country||'Radio',artwork:x.favicon?[{src:x.favicon}]:[]})}
const qi=()=>S.queue.findIndex(y=>S.cur&&y.stationuuid===S.cur.stationuuid);
const step=d=>{if(!S.queue.length)return;const i=qi();play(S.queue[(i<0?0:i+d+S.queue.length)%S.queue.length])};
function queueUI(){const q=S.queue,i=qi(),n=Math.min(6,q.length-1);$('#qs').parentNode.hidden=i<0||n<1;
  $('#qs').innerHTML=i<0?'':Array.from({length:n},(_,k)=>q[(i+1+k)%q.length]).map(x=>`<div class="rw" data-q="${esc(x.stationuuid)}" role="button" tabindex="0">${art(x)}<div class="nm"><b><span class="t">${esc(x.name.trim())}</span></b><small style="display:block">${esc(x.country||'')}</small></div></div>`).join('')}
async function random(){try{const p=new URLSearchParams({limit:10,order:'random',hidebroken:true});if(S.cc)p.set('countrycode',S.cc);if(S.tag)p.set('tag',S.tag);const r=(await api('/json/stations/search?'+p)).filter(okUrl);r[0]?play(r[0],r):toast(t('nf'),{err:1})}catch{toast(t('nf'),{err:1})}}
function toggleFav(x){if(!x)return;const i=S.favs.findIndex(y=>y.stationuuid===x.stationuuid);
  if(i<0){S.favs.unshift(x);toast(t('fa'),{ok:1})}else{const [rm]=S.favs.splice(i,1);toast(t('fd'),{act:t('undo'),fn:()=>{S.favs.splice(i,0,rm);ls.s('fav',S.favs);favUI();render()}})}
  ls.s('fav',S.favs);favUI();render()}
function favUI(){const f=isFav(S.cur);$('#fv').innerHTML=ic('heart',f?'f':'');$('#fv').classList.toggle('on',f)}
function pstate(p,m){S.pl=p;document.body.classList.toggle('pl',p);$$('#pp use,#pp2 use').forEach(u=>u.setAttribute('href',p?'#pause':'#play'));if(m)$('#ms').textContent=m;$$('.rw.on').forEach(e=>e.classList.toggle('pl',p))}
au.onplaying=()=>{S.errs=0;pstate(true,t('live'))};au.onpause=()=>pstate(false,t('paus'));au.onwaiting=()=>$('#ms').textContent=t('buf');
au.onerror=()=>{pstate(false,t('down'));if(++S.errs>=4){toast(t('stop'),{err:1});return}toast(t('skip'),{err:1});setTimeout(()=>{if(au.error)step(1)},1200)};
au.volume=ls.g('vol',.8);const setVol=v=>{au.volume=v;$('#vol').value=$('#vol2').value=v;$$('#vol,#vol2').forEach(r=>r.style.setProperty('--p',v*100+'%'));ls.s('vol',+v)};setVol(au.volume);$('#vol').oninput=$('#vol2').oninput=e=>setVol(e.target.value);
const tog=()=>{if(!S.cur)return random();au.paused?au.play().catch(()=>{}):au.pause()};
let sT,sM=0;
function sleepUI(){$('#slt').textContent=sM?`${t('sleep')} · ${sM} ${t('min')}`:t('sleep');$('#sl').classList.toggle('on',!!sM)}
$('#sl').onclick=e=>openMenu(e.currentTarget,{title:t('sleep'),value:String(sM),items:[0,15,30,60,90].map(m=>({v:String(m),l:m?m+' '+t('min'):t('s_off')})),
  onPick:v=>{clearTimeout(sT);sM=+v;if(sM){sT=setTimeout(()=>{au.pause();toast(t('s_done'),{ok:1});sM=0;sleepUI()},sM*6e4);toast(t('s_on',{m:sM}),{ok:1})}else toast(t('s_off'));sleepUI()}});

/* визуализатор (имитация: у чужих потоков нет доступа к спектру) */
const cv=$('#cv'),cx=cv.getContext('2d');let tt=0,lv=0;
function viz(){requestAnimationFrame(viz);if(!$('#np').classList.contains('open'))return;
  const d=devicePixelRatio,w=cv.width=cv.clientWidth*d,h=cv.height=cv.clientHeight*d;lv+=((S.pl?1:.05)-lv)*.07;tt+=.03;
  const n=Math.floor(w/(5*d)),bw=w/n;cx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--tx');cx.globalAlpha=.8;
  for(let i=0;i<n;i++){const a=(Math.sin(tt*1.4+i*.5)+Math.sin(tt*.8+i*.23)*.7+Math.sin(tt*2.2+i*.9)*.35+2.05)/4.1;
    const bh=Math.max(1.5*d,a*h*lv*(.3+.7*Math.sin(i/n*Math.PI)));cx.fillRect(i*bw+bw*.3,(h-bh)/2,bw*.4,bh)}}
viz();

/* события */
const sheet=o=>{$('#np').classList.toggle('open',o);if(o)queueUI()};
$('#open').onclick=()=>sheet(true);$('#up').onclick=()=>sheet(!$('#np').classList.contains('open'));$('#cl').onclick=()=>sheet(false);
let gy=null;const np=$('#np');
np.addEventListener('touchstart',e=>{if(np.scrollTop<=0&&innerWidth<=899)gy=e.touches[0].clientY},{passive:true});
np.addEventListener('touchmove',e=>{if(gy==null)return;const d=e.touches[0].clientY-gy;if(d>0){np.classList.add('drag');np.style.transform=`translateY(${d}px)`}},{passive:true});
np.addEventListener('touchend',e=>{if(gy==null)return;const d=e.changedTouches[0].clientY-gy;np.classList.remove('drag');np.style.transform='';if(d>110)sheet(false);gy=null});
$('#list').onclick=e=>{const f=e.target.closest('[data-f]');if(f)return toggleFav(S.list[f.dataset.f]);const r=e.target.closest('[data-i]');if(r){const x=S.list[r.dataset.i];S.cur&&x.stationuuid===S.cur.stationuuid?tog():play(x,S.list)}};
$('#list').onkeydown=e=>{if(e.key==='Enter'&&e.target.dataset.i!=null)e.target.click()};
$('#qs').onclick=e=>{const b=e.target.closest('[data-q]');if(b)play(S.queue.find(y=>y.stationuuid===b.dataset.q))};
const refilter=()=>S.tab==='fav'||S.tab==='hist'?setTab('all'):load(true);
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim();S.tab==='fav'||S.tab==='hist'?render():load(true)},400)};
function setTab(tb){S.tab=tb;closeMenu();$$('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===tb));const m=tb==='map';
  $('#mapw').style.display=m?'block':'none';$('#list').style.display=m?'none':'';scrollTo(0,0);render();load(true)}
$('#rail').onclick=e=>{const b=e.target.closest('.tb');if(b)setTab(b.dataset.t)};
$$('#pp,#pp2').forEach(b=>b.onclick=tog);$$('#nx,#nx2').forEach(b=>b.onclick=()=>step(1));$$('#pv,#pv2').forEach(b=>b.onclick=()=>step(-1));$('#fv').onclick=()=>toggleFav(S.cur);$('#rnd').onclick=$('#rnd2').onclick=random;
addEventListener('keydown',e=>{const tg=e.target;if(e.key==='Escape'){closeMenu();sheet(false);return}
  if(/INPUT|TEXTAREA/.test(tg.tagName)||tg.closest('#pop'))return;const k=e.key.toLowerCase();
  if(e.key==='/'){e.preventDefault();$('#q').focus()}else if(e.key===' '&&tg.tagName!=='BUTTON'&&tg.dataset.i==null){e.preventDefault();tog()}else if(k==='n')random();else if(k==='f')toggleFav(S.cur);
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(Math.min(1,au.volume+.05))}else if(e.key==='ArrowDown'){e.preventDefault();setVol(Math.max(0,au.volume-.05))}else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1))}
addEventListener('online',()=>{if(S.err){loadMeta();load(true)}});
applyLang();loadMeta();load(true);
</script>
